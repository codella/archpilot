name: Release Archpilot
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check version, test and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match pyproject.toml version'
          PY
          python3 -m unittest discover -s tests -v
          bash -n scripts/install.sh.in
          python3 -m venv .build-venv
          .build-venv/bin/python scripts/build_release.py --base-url "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$RELEASE_TAG/"* --verify-tag --title "Archpilot $RELEASE_TAG" --generate-notes
